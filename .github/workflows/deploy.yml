name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "terraform/**"
      - "deploy/aws/**"
      - "compose.ec2.yml"
      - "backend/**"
      - "database/*.dvc"
      - ".dvc/config"
      - ".dvcignore"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: movie-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_IN_AUTOMATION: "true"
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'movie-recommendation-system' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check deployment scripts and frontend
        run: |
          set -euo pipefail
          [[ -z "$VITE_API_BASE" || "$VITE_API_BASE" =~ ^https://([a-z0-9-]+\.)+[a-z0-9-]+/api$ ]]
          [[ "$PAGES_PROJECT" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          python -m pip install 'psycopg[binary]>=3,<4'
          python -m unittest discover -s deploy/aws -v
          npm ci --prefix frontend
          npm run lint --prefix frontend
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: movie-production
          role-duration-seconds: 10800
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false
      - name: Prepare Terraform state storage
        env:
          EXISTING_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          bucket="$EXISTING_STATE_BUCKET"
          if [[ -z "$bucket" ]]; then
            stack="movie-recs-state-$GITHUB_REPOSITORY_ID"
            aws cloudformation deploy --stack-name "$stack" --template-file terraform/state-bucket.yml --no-fail-on-empty-changeset
            bucket=$(aws cloudformation describe-stacks --stack-name "$stack" \
              --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue | [0]" --output text)
            [[ -n "$bucket" && "$bucket" != None ]] || { echo "Missing state bucket output from $stack" >&2; exit 1; }
          fi
          echo "Using Terraform state bucket $bucket"
          printf 'STATE_BUCKET=%s\n' "$bucket" >> "$GITHUB_ENV"
      - name: Apply infrastructure and read deployment targets
        working-directory: terraform
        env:
          TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$TF_VARS_JSON" ]]; then
            jq -e 'type == "object" and (.aws_region // env.AWS_REGION) == env.AWS_REGION' <<<"$TF_VARS_JSON" >/dev/null
            printf '%s' "$TF_VARS_JSON" > production.auto.tfvars.json
          fi
          terraform init -input=false -lockfile=readonly -backend-config="bucket=${STATE_BUCKET:?}" -backend-config="region=$AWS_REGION"
          terraform fmt -check
          terraform validate
          use_cloudfront=false
          if [[ -z "$VITE_API_BASE" ]]; then use_cloudfront=true; fi
          terraform plan -input=false -lock-timeout=5m -var="use_cloudfront_api=$use_cloudfront" -out=production.tfplan
          if ! terraform show -json production.tfplan | jq -e 'all(.resource_changes[]?; (.change.actions | index("delete")) == null)' >/dev/null; then
            echo "Plan includes resource destruction or replacement. Review and apply it separately." >&2
            exit 1
          fi
          terraform apply -input=false production.tfplan
          echo "USE_CLOUDFRONT_API=$use_cloudfront" >> "$GITHUB_ENV"
          if [[ "$use_cloudfront" == true ]]; then
            api=$(terraform output -raw cloudfront_api_base)
            [[ "$api" =~ ^https://[a-z0-9-]+\.cloudfront\.net/api$ ]]
            echo "VITE_API_BASE=$api" >> "$GITHUB_ENV"
          fi
          for name in ec2_instance_id ec2_public_ip rds_endpoint rds_port rds_master_secret_arn release_bucket runtime_secret_name; do
            value=$(terraform output -raw "$name")
            printf '%s=%s\n' "${name^^}" "${value:?missing Terraform output}" >> "$GITHUB_ENV"
          done
      - name: Build frontend with the production API URL
        run: npm run build --prefix frontend
      - name: Prepare Pages project and API DNS
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.VITE_API_BASE && vars.CLOUDFLARE_ZONE_ID || '' }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: python deploy/aws/cloudflare.py
      - name: Release backend and DVC data on EC2
        run: bash deploy/aws/dispatch.sh
      - name: Check public API and browser access
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 20 -D "$RUNNER_TEMP/api.headers" -o "$RUNNER_TEMP/api.json" \
            -H "Origin: $FRONTEND_ORIGIN" "$VITE_API_BASE/movies/search?q=matrix"
          jq -e 'type == "array" and length > 0' "$RUNNER_TEMP/api.json"
          tr -d '\r' < "$RUNNER_TEMP/api.headers" | grep -Fxi "access-control-allow-origin: $FRONTEND_ORIGIN"
      - name: Publish frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ env.PAGES_PROJECT }} --branch=main
      - name: Verify the published Pages build
        run: |
          set -euo pipefail
          bundle=$(grep -oE 'src="/assets/[^"]+\.js"' frontend/dist/index.html | head -1 | cut -d'"' -f2)
          for attempt in {1..30}; do
            if curl -fsS --max-time 15 "$FRONTEND_ORIGIN/?release=$GITHUB_SHA" -o "$RUNNER_TEMP/pages.html" &&
               grep -Fq "$bundle" "$RUNNER_TEMP/pages.html" &&
               curl -fsS --max-time 15 "$FRONTEND_ORIGIN$bundle" -o "$RUNNER_TEMP/pages.js" &&
               cmp -s "$RUNNER_TEMP/pages.js" "frontend/dist$bundle"; then
              echo "Verified $FRONTEND_ORIGIN$bundle"
              exit 0
            fi
            sleep 5
          done
          echo "Published frontend did not serve the expected JavaScript bundle" >&2
          exit 1
