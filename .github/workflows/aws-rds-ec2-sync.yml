name: Temporary EC2 and private-RDS blue-green deploy

on:
  push:
    branches: [main]
    paths:
      - "database/moviedb.sql.gz.dvc"
      - "backend/artifacts/v1.dvc"
      - "backend/chroma_data.dvc"
      - "backend/scripts/**"
      - "backend/app/**"
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "frontend/**"
      - "compose.ec2.yml"
      - "deploy/Caddyfile"
      - "deploy/aws/**"
      - ".github/workflows/aws-rds-ec2-sync.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: temporary-movie-rds-production
  cancel-in-progress: false

jobs:
  deploy:
    # Keep disabled until EC2, RDS, OIDC role, and initial manual bootstrap exist.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 110
    steps:
      - name: Assume AWS deployment role using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: movie-rds-sync

      - name: Invoke EC2 deployment using SSM (no SSH or runner in VPC)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          # Render SSM command JSON safely (the only argument is a validated Git SHA).
          jq -n --arg cmd "/opt/movie-recs/movie_recommendation_system/deploy/aws/entrypoint.sh $SHA" \
            '{commands:[$cmd],executionTimeout:["6000"]}' > /tmp/movie-ssm.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/movie-ssm.json \
            --timeout-seconds 3600 \
            --comment "movie recommendations: deploy ${SHA}" \
            --query 'Command.CommandId' --output text)
          echo "SSM command ID: $COMMAND_ID"
          success=false
          for attempt in $(seq 1 300); do
            # Command may be briefly unavailable while SSM propagates it.
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) success=true; break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 20
          done
          echo '--- EC2 deploy output (last 24k chars) ---'
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -c 24000 || true
          if [[ "$success" != true ]]; then
            echo '--- EC2 error output ---'
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -c 24000 || true
            echo "Deployment failed: $STATUS" >&2
            exit 1
          fi
